<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>御前比武</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="../nijo_gosho/css/style.css">
<style>
  /* 決鬥用的兩顆搖桿鍵：按住後左右拖曳選方向，放開出手 */
  .stick { position: absolute; width: 92px; height: 92px; border-radius: 50%; border: 2px solid rgba(232,224,204,.35); background: rgba(26,21,19,.5); touch-action: none; display: flex; align-items: center; justify-content: center; }
  .stick span { font-family: var(--f-serif); font-weight: 900; font-size: 22px; color: var(--washi); pointer-events: none; }
  .stick i { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: rgba(232,224,204,.25); pointer-events: none; transform: translate(0, 0); }
  .stick.on { background: rgba(60,40,30,.6); }
  #sAtk { right: 20px; bottom: 30%; border-color: rgba(200,64,44,.8); }
  #sDef { right: 132px; bottom: calc(30% - 34px); border-color: rgba(120,160,210,.8); }
  @media (max-height: 420px) { #sAtk { bottom: 20%; } #sDef { bottom: calc(20% - 30px); } }
</style>
</head>
<body>
<div id="app">
  <div id="view" style="flex:1">
    <canvas id="cv" aria-label="遊戲畫面"></canvas>
    <canvas id="ui" aria-hidden="true"></canvas>
    <div id="toast" role="status"></div>
    <div id="touch" hidden>
      <div id="knob" hidden></div>
      <div class="stick" id="sDef"><i></i><span>守</span></div>
      <div class="stick" id="sAtk"><i></i><span>攻</span></div>
    </div>
    <div id="screen"><div class="panel" id="panel"></div></div>
  </div>
</div>
<script src="../nijo_gosho/js/config.js"></script>
<script src="../nijo_gosho/js/util.js"></script>
<script src="../nijo_gosho/js/audio.js"></script>
<script src="../nijo_gosho/js/assets.js"></script>
<script src="../nijo_gosho/js/world.js"></script>
<script src="../nijo_gosho/js/render.js"></script>
<script src="duel.js"></script>
</body>
</html>
