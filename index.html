<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samurai Last Stand</title>
<meta name="description" content="以歷史上武士的最後一戰為題材的瀏覽器第一人稱刀戰 roguelike 合集。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：一欄式，標題之下是一張張「戰場卡」，每張卡一位人物、一場最後之戰 */
:root {
  --urushi: #0e0b0a; --sumi: #1a1513; --kaba: #2b211d; --line: #3d2f28;
  --shu: #c8402c; --kin: #c9a34a; --washi: #e8e0cc; --dim: #9a8e7c;
  --f-serif: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --f-sans: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--urushi); color: var(--washi); font-family: var(--f-sans); }
body { padding: calc(40px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
header { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
.eyebrow { font-family: var(--f-serif); font-size: 12px; letter-spacing: .3em; color: var(--kin); }
h1 { margin: 0; font-family: var(--f-serif); font-weight: 900; font-size: clamp(34px, 8vw, 58px); letter-spacing: .06em; line-height: 1.05; text-wrap: balance; }
h1 span { display: block; font-size: .42em; letter-spacing: .4em; color: var(--dim); margin-top: 10px; font-weight: 500; }
.lead { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.75; max-width: 60ch; }
.list { display: flex; flex-direction: column; gap: 16px; }
.card { position: relative; display: grid; grid-template-columns: 104px 1fr; gap: 20px; padding: 20px; background: var(--sumi); border: 1px solid var(--line); border-left: 3px solid var(--shu); color: inherit; text-decoration: none; transition: border-color .15s, background .15s; }
a.card:hover, a.card:focus-visible { background: var(--kaba); border-color: var(--kin); border-left-color: var(--shu); outline: none; }
.year { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.year b { font-family: var(--f-serif); font-weight: 900; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }
.year small { font-size: 12px; color: var(--dim); letter-spacing: .1em; }
.body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.who { font-family: var(--f-serif); font-weight: 900; font-size: 24px; letter-spacing: .12em; margin: 0; }
.where { font-size: 13px; color: var(--kin); letter-spacing: .14em; }
.body p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.7; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 11px; letter-spacing: .1em; padding: 2px 8px; border: 1px solid var(--line); color: var(--dim); }
.tag.live { border-color: var(--shu); color: var(--washi); }
.go { font-family: var(--f-serif); font-weight: 900; letter-spacing: .3em; color: var(--shu); font-size: 15px; margin-top: 4px; }
.soon { border-left-color: var(--line); opacity: .55; }
footer { color: var(--dim); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); padding-top: 16px; }
footer a { color: var(--washi); }
@media (max-width: 520px) { .card { grid-template-columns: 1fr; gap: 12px; } .year { flex-direction: row; align-items: baseline; gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">最後之戰</div>
    <h1>Samurai Last Stand<span>武士の最期</span></h1>
    <p class="lead">每一場戰鬥都已經寫好了結局。你不是來改寫它的，而是來決定倒下之前，能斬開多少條路。選一位人物，走進他最後的戰場。</p>
  </header>

  <section class="list" id="list" aria-label="人物與戰場"></section>

  <footer>
    瀏覽器第一人稱刀戰 roguelike，持續製作中。原始碼：<a href="https://github.com/darkbearlab/samurai_last_stand">darkbearlab/samurai_last_stand</a>
  </footer>
</main>

<script>
/* 新增人物或模式時，在這個陣列加一筆即可。path 指向該作品的目錄。 */
const SCENARIOS = [
  {
    path: 'nijo_gosho/index.html',
    year: '1565', era: '永祿八年',
    who: '足利義輝',
    where: '二條御所',
    text: '將軍的御所被三好軍包圍。手上只有一把脇差，散落在各房間的名刀要一把一把收回來，直到火與盾牆把你逼進最後的主殿。',
    tags: ['原型 v0.1', '蓄力刀戰', '隨機御所'],
    live: true,
  },
];

const list = document.getElementById('list');
list.innerHTML = SCENARIOS.map((s) => {
  const inner = `
    <div class="year"><b>${s.year}</b><small>${s.era}</small></div>
    <div class="body">
      <h2 class="who">${s.who}</h2>
      <div class="where">${s.where}</div>
      <p>${s.text}</p>
      <div class="tags">${s.tags.map((t, i) => `<span class="tag${i === 0 && s.live ? ' live' : ''}">${t}</span>`).join('')}</div>
      ${s.live ? '<div class="go">出陣 →</div>' : ''}
    </div>`;
  return s.live ? `<a class="card" href="${s.path}">${inner}</a>` : `<div class="card soon">${inner}</div>`;
}).join('');
</script>
</body>
</html>
